<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Sửa CV</title>
<link rel="stylesheet" href="cv-style.css">
<style>
  .admin-bar{
    position:sticky; top:0; z-index:20;
    display:flex; align-items:center; gap:8px; flex-wrap:wrap;
    padding:10px 16px;
    background:#15171c; color:#e4e6ea;
    border-bottom:1px solid #33363f;
  }
  .admin-bar input[type="password"]{
    padding:6px 10px; border-radius:6px; border:1px solid #33363f;
    background:#0f1115; color:#e4e6ea; font-size:13px; width:200px;
  }
  .admin-bar .btn{ border-color:#33363f; color:#c7cad1; }
  .admin-bar .btn.active{ background:#7fb0ff; color:#0f1115; border-color:#7fb0ff; }
  .admin-bar .msg{ font-size:12.5px; margin-left:auto; }
  .admin-bar .msg.ok{ color:#3ecf8e; }
  .admin-bar .msg.err{ color:#ff8080; }
  .admin-bar .spacer{ width:1px; height:20px; background:#33363f; margin:0 4px; }

  #json-view{ display:none; }
  #json-view textarea{
    width:100%; height:70vh; min-height:400px;
    padding:14px; border-radius:8px; box-sizing:border-box;
    border:1px solid var(--border); background:#0b0d12; color:#e4e6ea;
    font-family:"Cascadia Code", Consolas, monospace; font-size:13px;
    line-height:1.5; resize:vertical; tab-size:2;
  }
</style>
</head>
<body>

<div class="admin-bar">
  <input type="password" id="password" autocomplete="current-password" placeholder="Mật khẩu quản trị">
  <button class="btn primary" id="save-btn">Lưu thay đổi</button>
  <button class="btn" id="reload-btn" type="button">Tải lại</button>
  <div class="spacer"></div>
  <button class="btn view-btn active" data-view="visual">Giao diện</button>
  <button class="btn view-btn" data-view="json">JSON</button>
  <div class="spacer"></div>
  <button class="btn lang-btn active" data-lang="vi">VI</button>
  <button class="btn lang-btn" data-lang="en">EN</button>
  <span class="msg" id="msg"></span>
</div>

<div class="wrap" id="visual-view">
  <div id="app">Đang tải...</div>
</div>

<div class="wrap" id="json-view">
  <textarea id="json-text" spellcheck="false"></textarea>
</div>

<script src="cv-render.js"></script>
<script>
  let cv = null;
  let lang = 'vi';
  let view = 'visual';
  let dirty = false;

  const msgEl = document.getElementById('msg');
  const passwordEl = document.getElementById('password');
  const jsonTextEl = document.getElementById('json-text');
  const visualViewEl = document.getElementById('visual-view');
  const jsonViewEl = document.getElementById('json-view');
  const appEl = document.getElementById('app');

  appEl.addEventListener('input', () => { dirty = true; });
  jsonTextEl.addEventListener('input', () => { dirty = true; });
  window.addEventListener('beforeunload', (e) => {
    if (dirty){ e.preventDefault(); e.returnValue = ''; }
  });

  function setMsg(text, kind){
    msgEl.textContent = text;
    msgEl.className = 'msg' + (kind ? ' ' + kind : '');
  }

  function renderVisual(){
    if (!cv) return;
    CVRender.mount(document.getElementById('app'), cv, lang, true);
  }

  function setLang(l){
    lang = l;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    renderVisual();
  }
  document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));

  function setView(v){
    if (view === 'json' && v === 'visual'){
      // leaving JSON tab: parse it back into cv before switching
      try {
        cv = JSON.parse(jsonTextEl.value);
        setMsg('', '');
      } catch (e) {
        setMsg('JSON không hợp lệ, chưa thể chuyển tab: ' + e.message, 'err');
        return;
      }
    }
    if (view === 'visual' && v === 'json'){
      jsonTextEl.value = JSON.stringify(cv, null, 2);
    }
    view = v;
    document.querySelectorAll('.view-btn').forEach(b => b.classList.toggle('active', b.dataset.view === v));
    visualViewEl.style.display = v === 'visual' ? 'block' : 'none';
    jsonViewEl.style.display = v === 'json' ? 'block' : 'none';
    if (v === 'visual') renderVisual();
  }
  document.querySelectorAll('.view-btn').forEach(btn => btn.addEventListener('click', () => setView(btn.dataset.view)));

  function loadData(){
    setMsg('Đang tải...', '');
    return fetch('data.json?v=' + Date.now())
      .then(r => r.json())
      .then(data => { cv = data; dirty = false; renderVisual(); setMsg('Đã tải nội dung mới nhất.', 'ok'); })
      .catch(err => setMsg('Không tải được data.json: ' + err, 'err'));
  }

  document.getElementById('reload-btn').addEventListener('click', () => {
    if (confirm('Bỏ thay đổi hiện tại và tải lại từ server?')) loadData();
  });

  document.getElementById('save-btn').addEventListener('click', () => {
    if (view === 'json'){
      try { cv = JSON.parse(jsonTextEl.value); }
      catch (e) { setMsg('JSON không hợp lệ: ' + e.message, 'err'); return; }
    }
    if (!passwordEl.value){
      setMsg('Nhập mật khẩu trước đã.', 'err');
      return;
    }
    const saveBtn = document.getElementById('save-btn');
    saveBtn.disabled = true;
    setMsg('Đang lưu...', '');
    fetch('/api/save-cv', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: passwordEl.value, content: cv })
    })
      .then(async r => {
        const body = await r.json().catch(() => ({}));
        if (!r.ok) throw new Error(body.error || ('HTTP ' + r.status));
        dirty = false;
        if (body.unchanged) setMsg('Không có gì thay đổi so với bản hiện tại - chưa commit gì cả.', 'ok');
        else setMsg('Đã lưu và commit lên GitHub. Trang CV sẽ cập nhật sau khoảng 1 phút.', 'ok');
      })
      .catch(err => setMsg('Lỗi: ' + err.message, 'err'))
      .finally(() => { saveBtn.disabled = false; });
  });

  loadData();
</script>

</body>
</html>
