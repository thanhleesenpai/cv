<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lê Minh Thành — Backend Developer</title>
<meta name="description" content="CV online của Lê Minh Thành, Backend Developer.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='12' fill='%232255aa'/%3E%3Ctext x='32' y='42' font-family='Arial,Helvetica,sans-serif' font-size='26' font-weight='700' fill='white' text-anchor='middle'%3ELMT%3C/text%3E%3C/svg%3E">

<meta property="og:type" content="website">
<meta property="og:title" content="Lê Minh Thành — Backend Developer">
<meta property="og:description" content="CV online của Lê Minh Thành, Backend Developer. Kinh nghiệm Java/Spring Boot, Node.js, PHP, microservices.">
<meta property="og:url" content="https://cv-ten-cyan-52.vercel.app/">
<meta property="og:image" content="https://cv-ten-cyan-52.vercel.app/photo.jpg">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="Lê Minh Thành — Backend Developer">
<meta name="twitter:description" content="CV online của Lê Minh Thành, Backend Developer.">
<meta name="twitter:image" content="https://cv-ten-cyan-52.vercel.app/photo.jpg">
<style>
  :root{
    --page-bg:#e7e9ee;
    --bg:#ffffff;
    --text:#222222;
    --text-dim:#5a5a5a;
    --border:#d9d9d9;
    --heading:#111111;
    --link:#2255aa;
    --max-w:210mm;
  }
  :root[data-theme="dark"]{
    --page-bg:#0b0c0f;
    --bg:#15171c;
    --text:#e4e6ea;
    --text-dim:#a2a6ae;
    --border:#33363f;
    --heading:#ffffff;
    --link:#7fb0ff;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0;
    background:var(--page-bg);
    color:var(--text);
    font-family:Arial, Helvetica, "Segoe UI", sans-serif;
    line-height:1.5;
    font-size:14.5px;
  }
  a{ color:var(--link); text-decoration:none; }
  a:hover{ text-decoration:underline; }

  .topbar{
    position:sticky; top:0; z-index:10;
    display:flex; justify-content:flex-end; gap:6px;
    padding:10px 16px;
    background:var(--page-bg);
    border-bottom:1px solid var(--border);
  }
  .btn{
    border:1px solid var(--border);
    background:transparent;
    color:var(--text-dim);
    padding:4px 12px;
    border-radius:999px;
    font-size:12px;
    cursor:pointer;
    font-weight:600;
  }
  .btn.active{ background:var(--heading); color:var(--bg); border-color:var(--heading); }
  .btn.primary{ background:var(--link); color:#fff; border-color:var(--link); }

  .wrap{
    max-width:var(--max-w); margin:24px auto 48px;
    padding:18mm 16mm;
    background:var(--bg);
    box-shadow:0 1px 4px rgba(0,0,0,.15), 0 8px 24px rgba(0,0,0,.12);
    min-height:40vh;
  }

  .header{
    display:flex; gap:26px; margin-bottom:26px;
  }
  .avatar-wrap{ flex-shrink:0; width:140px; }
  .avatar-wrap img{
    width:140px; height:175px; object-fit:cover;
    border:1px solid var(--border);
    display:block;
  }
  .avatar-fallback{
    width:140px; height:175px;
    border:1px solid var(--border);
    display:none;
    align-items:center; justify-content:center;
    font-size:36px; font-weight:700;
    color:var(--text-dim);
    background:color-mix(in srgb, var(--text-dim) 8%, transparent);
  }
  .header h1{ margin:0 0 4px; font-size:30px; color:var(--heading); font-weight:800; }
  .header .role{ font-size:18px; font-weight:700; margin-bottom:10px; color:var(--heading); }
  .info-line{ font-weight:700; font-size:14.5px; margin-bottom:2px; }

  h2.section-title{
    font-size:19px;
    font-weight:800;
    color:var(--heading);
    margin:0 0 14px;
    padding-bottom:8px;
    border-bottom:2px solid var(--text);
  }
  section.block{ margin-bottom:28px; }

  .entry-row{
    display:grid;
    grid-template-columns:110px 1fr;
    gap:18px;
    padding-bottom:14px;
    margin-bottom:14px;
    border-bottom:1px solid var(--border);
  }
  .entry-row:last-child{ border-bottom:none; margin-bottom:0; padding-bottom:0; }
  .date-col{ font-size:13px; color:var(--text-dim); }
  .content-col .title{ font-weight:700; font-size:15px; }
  .content-col .subtitle{ font-weight:700; margin:2px 0 8px; }
  .content-col p.desc{ margin:4px 0 8px; }
  .content-col ul{ list-style:none; margin:6px 0 0; padding:0; }
  .content-col li{ position:relative; padding-left:16px; margin-bottom:5px; }
  .content-col li::before{ content:"•"; position:absolute; left:0; }
  .tech-line{ font-size:13px; color:var(--text-dim); margin-top:8px; }
  .tech-line b{ color:var(--text); font-weight:700; }
  .meta-line{ font-size:13px; color:var(--text-dim); margin-bottom:6px; }

  .skills-grid{ display:grid; grid-template-columns:150px 1fr; gap:10px 16px; }
  .skills-grid dt{ font-weight:700; }
  .skills-grid dd{ margin:0; }

  footer{ text-align:center; color:var(--text-dim); font-size:12px; padding:20px 0 0; }

  @media (max-width:620px){
    .header{ flex-direction:column; align-items:flex-start; }
    .entry-row{ grid-template-columns:1fr; gap:4px; }
    .skills-grid{ grid-template-columns:1fr; }
    .wrap{ margin:0; padding:20px 16px 40px; box-shadow:none; }
  }

  @page{
    size: A4;
    margin: 10mm 10mm;
  }
  @media print{
    :root{
      --bg:#ffffff; --text:#222222; --text-dim:#5a5a5a;
      --border:#d9d9d9; --heading:#111111; --link:#2255aa;
    }
    .topbar{ display:none; }
    body{ font-size:10px; line-height:1.35; background:#fff; }
    .wrap{ max-width:none; margin:0; padding:0; background:transparent; box-shadow:none; }
    a{ color:var(--text); text-decoration:none; }
    .entry-row, .header{ break-inside: avoid; page-break-inside: avoid; }
    p, li{ orphans:3; widows:3; }
    footer{ display:none; }

    .header{ gap:14px; margin-bottom:12px; }
    .avatar-wrap, .avatar-wrap img, .avatar-fallback{ width:85px; height:106px; }
    .header h1{ font-size:19px; margin-bottom:2px; }
    .header .role{ font-size:12px; margin-bottom:6px; }
    .info-line{ font-size:10px; margin-bottom:0; }

    h2.section-title{ font-size:13px; margin:0 0 6px; padding-bottom:3px; border-bottom-width:1.5px; }
    section.block{ margin-bottom:10px; }

    .date-col{ font-size:9px; }
    .entry-row{ gap:10px; padding-bottom:6px; margin-bottom:6px; }
    .content-col .title{ font-size:11px; }
    .content-col .subtitle{ margin:1px 0 3px; }
    .content-col p.desc{ margin:2px 0 4px; }
    .content-col li{ margin-bottom:2px; }
    .meta-line{ font-size:9px; margin-bottom:3px; }
    .tech-line{ font-size:9px; margin-top:4px; }

    .skills-grid{ gap:4px 16px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <button class="btn primary" id="download-btn">⬇ <span id="download-label">Tải CV PDF</span></button>
  <button class="btn lang-btn" data-lang="vi">VI</button>
  <button class="btn lang-btn" data-lang="en">EN</button>
  <button class="btn" id="theme-toggle">Dark/Light</button>
</div>

<div class="wrap">
  <div id="app"></div>
</div>

<script>
  const UI = {
    vi: { about:"GIỚI THIỆU BẢN THÂN", education:"HỌC VẤN", experience:"KINH NGHIỆM LÀM VIỆC",
          projects:"DỰ ÁN", certifications:"CHỨNG CHỈ", skills:"CÁC KỸ NĂNG & SỞ THÍCH",
          updated:"Cập nhật lần cuối", tech:"Công nghệ sử dụng:", download:"Tải CV PDF",
          github:"GitHub" },
    en: { about:"ABOUT ME", education:"EDUCATION", experience:"WORK EXPERIENCE",
          projects:"PROJECTS", certifications:"CERTIFICATIONS", skills:"SKILLS",
          updated:"Last updated", tech:"Tech stack:", download:"Download PDF",
          github:"GitHub" }
  };

  let cv = null;
  let lang = 'vi';

  function t(field){
    if (field == null) return '';
    if (typeof field === 'string') return field;
    return field[lang] != null ? field[lang] : (field.vi || '');
  }

  function el(tag, opts, children){
    opts = opts || {};
    const e = document.createElement(tag);
    if (opts.class) e.className = opts.class;
    if (opts.text != null) e.textContent = opts.text;
    if (opts.href != null){ e.href = opts.href; e.target = '_blank'; e.rel = 'noopener'; }
    (children || []).forEach(c => { if (c) e.appendChild(c); });
    return e;
  }

  function sectionTitle(key){
    return el('h2', { class:'section-title', text: UI[lang][key] });
  }

  function renderHeader(){
    const p = cv.person;
    const avatarWrap = el('div', { class:'avatar-wrap' });
    const img = document.createElement('img');
    img.id = 'avatar'; img.alt = p.name; img.src = p.photo || 'photo.jpg';
    img.onerror = function(){
      if (this.dataset.step !== 'png'){ this.dataset.step='png'; this.src = (p.photo||'photo').replace(/\.\w+$/,'') + '.png'; }
      else { this.style.display='none'; fallback.style.display='flex'; }
    };
    const fallback = el('div', { class:'avatar-fallback', text: p.name.split(' ').slice(-2).map(w=>w[0]).join('').toUpperCase() });
    avatarWrap.appendChild(img); avatarWrap.appendChild(fallback);

    const infoBox = el('div');
    infoBox.appendChild(el('h1', { text: p.name }));
    infoBox.appendChild(el('div', { class:'role', text: p.role }));
    p.infoLines.forEach(line => infoBox.appendChild(el('div', { class:'info-line', text: t(line) })));
    const emailLine = el('div', { class:'info-line' });
    emailLine.append('Email: ');
    emailLine.appendChild(el('a', { text: p.email, href: 'mailto:' + p.email }));
    infoBox.appendChild(emailLine);
    const ghLine = el('div', { class:'info-line' });
    ghLine.append('Github: ');
    ghLine.appendChild(el('a', { text: p.github.label, href: p.github.url }));
    infoBox.appendChild(ghLine);
    if (p.linkedin){
      const liLine = el('div', { class:'info-line' });
      liLine.append('LinkedIn: ');
      liLine.appendChild(el('a', { text: p.linkedin.label, href: p.linkedin.url }));
      infoBox.appendChild(liLine);
    }

    return el('section', { class:'header' }, [avatarWrap, infoBox]);
  }

  function renderAbout(){
    return el('section', { class:'block' }, [
      sectionTitle('about'),
      el('p', { text: t(cv.about) })
    ]);
  }

  function renderEducation(){
    const rows = cv.education.map(edu => el('div', { class:'entry-row' }, [
      el('div', { class:'date-col', text: edu.date }),
      el('div', { class:'content-col' }, [
        el('div', { class:'title', text: t(edu.title) }),
        el('div', { class:'subtitle', text: t(edu.subtitle) }),
        el('p', { class:'desc' }, [ el('em', { text: t(edu.note) }) ])
      ])
    ]));
    return el('section', { class:'block' }, [sectionTitle('education'), ...rows]);
  }

  function renderExperience(){
    const rows = cv.experience.map(job => el('div', { class:'entry-row' }, [
      el('div', { class:'date-col', text: job.date }),
      el('div', { class:'content-col' }, [
        el('div', { class:'title', text: t(job.company) }),
        el('div', { class:'subtitle', text: t(job.role) }),
        el('ul', {}, job.bullets.map(b => el('li', { text: t(b) })))
      ])
    ]));
    return el('section', { class:'block' }, [sectionTitle('experience'), ...rows]);
  }

  function renderProjects(){
    const rows = cv.projects.map(pr => {
      const titleDiv = el('div', { class:'title' });
      titleDiv.append(pr.title + ' ');
      if (pr.titleSuffix) titleDiv.append(t(pr.titleSuffix));
      const ghLine = el('div', { class:'meta-line' });
      ghLine.append('GitHub: ');
      ghLine.appendChild(el('a', { text: pr.github.replace(/^https?:\/\//,''), href: pr.github }));
      const techLine = el('div', { class:'tech-line' }, [
        el('b', { text: UI[lang].tech + ' ' })
      ]);
      techLine.append(pr.tech);
      return el('div', { class:'entry-row' }, [
        el('div', { class:'date-col', text: pr.date }),
        el('div', { class:'content-col' }, [
          titleDiv,
          el('div', { class:'meta-line', text: t(pr.meta) }),
          ghLine,
          el('p', { class:'desc', text: t(pr.desc) }),
          el('ul', {}, pr.bullets.map(b => el('li', { text: t(b) }))),
          techLine
        ])
      ]);
    });
    return el('section', { class:'block' }, [sectionTitle('projects'), ...rows]);
  }

  function renderCertifications(){
    const rows = cv.certifications.map(c => el('div', { class:'entry-row' }, [
      el('div', { class:'date-col', text: c.date }),
      el('div', { class:'content-col' }, [ el('div', { class:'title', text: c.title }) ])
    ]));
    return el('section', { class:'block' }, [sectionTitle('certifications'), ...rows]);
  }

  function renderSkills(){
    const dl = el('dl', { class:'skills-grid' });
    cv.skills.forEach(s => {
      dl.appendChild(el('dt', { text: t(s.label) }));
      dl.appendChild(el('dd', { text: t(s.value) }));
    });
    return el('section', { class:'block' }, [sectionTitle('skills'), dl]);
  }

  function renderFooter(){
    return el('footer', { text: UI[lang].updated + ': ' + cv.meta.updated });
  }

  function render(){
    const app = document.getElementById('app');
    app.innerHTML = '';
    app.appendChild(renderHeader());
    app.appendChild(renderAbout());
    app.appendChild(renderEducation());
    app.appendChild(renderExperience());
    app.appendChild(renderProjects());
    app.appendChild(renderCertifications());
    app.appendChild(renderSkills());
    app.appendChild(renderFooter());
    document.getElementById('download-label').textContent = UI[lang].download;
  }

  function setLang(l){
    lang = l;
    document.querySelectorAll('.lang-btn').forEach(b => b.classList.toggle('active', b.dataset.lang === l));
    document.documentElement.lang = l;
    localStorage.setItem('cv-lang', l);
    if (cv) render();
  }

  document.querySelectorAll('.lang-btn').forEach(btn => btn.addEventListener('click', () => setLang(btn.dataset.lang)));
  document.getElementById('download-btn').addEventListener('click', () => window.print());

  const themeBtn = document.getElementById('theme-toggle');
  function setTheme(theme){
    document.documentElement.setAttribute('data-theme', theme);
    localStorage.setItem('cv-theme', theme);
  }
  themeBtn.addEventListener('click', () => {
    const current = document.documentElement.getAttribute('data-theme') || 'light';
    setTheme(current === 'dark' ? 'light' : 'dark');
  });
  const savedTheme = localStorage.getItem('cv-theme');
  if (savedTheme) setTheme(savedTheme);

  const browserLang = (navigator.language || 'vi').toLowerCase().startsWith('en') ? 'en' : 'vi';
  const initialLang = localStorage.getItem('cv-lang') || browserLang;

  fetch('data.json?v=' + Date.now())
    .then(r => r.json())
    .then(data => { cv = data; setLang(initialLang); })
    .catch(err => {
      document.getElementById('app').textContent = 'Không tải được nội dung CV (data.json). ' + err;
    });
</script>

</body>
</html>
